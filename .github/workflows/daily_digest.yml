name: Daily Financial Digest

on:
  schedule:
    # Run daily at 06:00 UTC = 14:00 Taiwan time (UTC+8)
    - cron: "0 6 * * *"

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log verbosity (DEBUG / INFO / WARNING)"
        required: false
        default: "INFO"
      dry_run:
        description: "Dry run — build pipeline but skip file output (true/false)"
        required: false
        default: "false"

# Allow the workflow to push to the repo (for docs/ update) and deploy Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-digest:
    name: Generate Daily Financial Digest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Required for the deploy-pages action
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      # ---------------------------------------------------------------- #
      # 1. Checkout                                                        #
      # ---------------------------------------------------------------- #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push docs/ back
          fetch-depth: 0

      # ---------------------------------------------------------------- #
      # 2. Python setup                                                    #
      # ---------------------------------------------------------------- #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---------------------------------------------------------------- #
      # 3. Set date env var                                               #
      # ---------------------------------------------------------------- #
      - name: Set TODAY env var
        run: echo "TODAY=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      # ---------------------------------------------------------------- #
      # 4. Wake up Render webapp (free tier cold start)                    #
      # ---------------------------------------------------------------- #
      - name: Wake up webapp (Render free tier)
        continue-on-error: true
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        run: |
          if [ -z "$WEBAPP_URL" ]; then
            echo "WEBAPP_URL not configured — skipping wake-up."
            exit 0
          fi
          echo "Waking up $WEBAPP_URL ..."
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 20 "$WEBAPP_URL/api/settings" > /dev/null; then
              echo "Webapp is ready (attempt $i)."
              exit 0
            fi
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          echo "Webapp did not respond — pipeline will fall back to local settings."

      # ---------------------------------------------------------------- #
      # 5. Run digest pipeline                                             #
      # ---------------------------------------------------------------- #
      - name: Run digest pipeline
        env:
          WSJ_EMAIL:    ${{ secrets.WSJ_EMAIL }}
          WSJ_PASSWORD: ${{ secrets.WSJ_PASSWORD }}
          WEBAPP_URL:   ${{ secrets.WEBAPP_URL }}
        run: |
          python run_digest.py \
            --log-level "${{ github.event.inputs.log_level || 'INFO' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # ---------------------------------------------------------------- #
      # 6. Push generated digest to Render webapp                         #
      # ---------------------------------------------------------------- #
      - name: Push digest to Render webapp
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          WEBAPP_URL:  ${{ secrets.WEBAPP_URL }}
          PUSH_TOKEN:  ${{ secrets.PUSH_TOKEN }}
        run: |
          if [ -z "$WEBAPP_URL" ] || [ -z "$PUSH_TOKEN" ]; then
            echo "WEBAPP_URL or PUSH_TOKEN not configured — skipping push to webapp."
            exit 0
          fi
          HTML_FILE="output/daily_digest_${TODAY}.html"
          if [ ! -f "$HTML_FILE" ]; then
            echo "No HTML file found at $HTML_FILE — skipping push."
            exit 0
          fi
          echo "Pushing digest to $WEBAPP_URL/api/push-digest ..."
          HTTP_STATUS=$(curl -s -o /tmp/push_response.txt -w "%{http_code}" \
            -X POST "$WEBAPP_URL/api/push-digest" \
            -H "Authorization: Bearer $PUSH_TOKEN" \
            -H "Content-Type: text/html; charset=utf-8" \
            --data-binary "@$HTML_FILE" \
            --max-time 30)
          echo "Response ($HTTP_STATUS): $(cat /tmp/push_response.txt)"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Digest pushed to Render webapp successfully."
          else
            echo "Push failed with HTTP $HTTP_STATUS — digest is still on GitHub Pages."
          fi

      # ---------------------------------------------------------------- #
      # 7. Upload output files as artifacts (30-day retention)            #
      # ---------------------------------------------------------------- #
      - name: Upload digest artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-digest-${{ env.TODAY }}
          path: output/
          retention-days: 30

      # ---------------------------------------------------------------- #
      # 8. Copy report to docs/ and rebuild Pages index                   #
      # ---------------------------------------------------------------- #
      - name: Copy report to docs/reports/
        if: github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p docs/reports
          if [ -f "output/daily_digest_$TODAY.html" ]; then
            cp "output/daily_digest_$TODAY.html" "docs/reports/$TODAY.html"
            echo "Copied daily_digest_$TODAY.html → docs/reports/$TODAY.html"
          else
            echo "No output file found for $TODAY — skipping copy"
          fi

      - name: Rebuild Pages index
        if: github.event.inputs.dry_run != 'true'
        run: python scripts/build_pages.py

      # ---------------------------------------------------------------- #
      # 9. Commit updated docs/ back to the repository                    #
      # ---------------------------------------------------------------- #
      - name: Commit updated docs/ to repository
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes in docs/ — skipping commit."
          else
            git commit -m "pages: add digest $TODAY"
            git push
          fi

      # ---------------------------------------------------------------- #
      # 10. Deploy docs/ to GitHub Pages                                   #
      # ---------------------------------------------------------------- #
      - name: Setup Pages
        if: github.event.inputs.dry_run != 'true'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: github.event.inputs.dry_run != 'true'
        id: deploy-pages
        uses: actions/deploy-pages@v4
